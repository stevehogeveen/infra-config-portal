name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  linux:
    name: Linux Make Gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: app/frontend/package-lock.json
      - name: Install backend dependencies
        run: make -C app backend-venv
      - name: Install frontend dependencies
        run: npm ci
        working-directory: app/frontend
      - name: Validate Compose contract
        run: docker compose config --quiet
        working-directory: app
      - name: Smoke fresh Compose launch
        shell: bash
        working-directory: app
        run: |
          set -euo pipefail
          trap 'docker compose down --volumes --remove-orphans' EXIT
          docker compose up --detach --build --wait --wait-timeout 180
          curl --fail --silent http://127.0.0.1:8001/health | python -c 'import json,sys; value=json.load(sys.stdin); assert value["status"] == "ok"; assert value["provider_mode"] == "mock"'
          curl --fail --silent http://127.0.0.1:5173/overview >/dev/null
      - name: Run Linux test gate
        run: make test
      - name: Run Linux lint gate
        run: make lint

  windows:
    name: Windows PowerShell Gate
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: app/frontend/package-lock.json
      - name: Install backend dependencies
        shell: powershell
        run: .\scripts\ensure-backend-venv.ps1 -ForceInstall
        working-directory: app
      - name: Install frontend dependencies
        shell: powershell
        run: .\scripts\ensure-frontend-deps.ps1 -ForceInstall
        working-directory: app
      - name: Install Playwright browser
        shell: powershell
        run: .\scripts\ensure-playwright-browsers.ps1 -Install
        working-directory: app
      - name: Run Windows gate
        shell: powershell
        run: .\scripts\check-windows.ps1 -E2E
        working-directory: app

      - name: Upload Windows gate artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-gate-artifacts
          path: |
            artifacts/codex-runs
            app/frontend/test-results
            app/frontend/playwright-report
          if-no-files-found: ignore

  windows-fast-verify:
    name: Windows Fast Verify Gate
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: app/frontend/package-lock.json
      - name: Install backend dependencies
        shell: powershell
        run: .\scripts\ensure-backend-venv.ps1 -ForceInstall
        working-directory: app
      - name: Install frontend dependencies
        shell: powershell
        run: .\scripts\ensure-frontend-deps.ps1 -ForceInstall
        working-directory: app
      - name: Install Playwright browser
        shell: powershell
        run: .\scripts\ensure-playwright-browsers.ps1 -Install
        working-directory: app
      - name: Run full fast verification gate
        shell: powershell
        run: .\scripts\fast-verify.ps1 -Full
        working-directory: app
      - name: Upload fast verification artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-fast-verify-artifacts
          path: |
            artifacts/codex-runs/fast-verify-plan.json
            artifacts/codex-runs/openapi-contract-probe.json
            artifacts/codex-runs/qa-capability-audit.json
            artifacts/codex-runs/qa-failure-packets
            app/frontend/test-results
            app/frontend/playwright-report
          if-no-files-found: ignore
