baseline_id: real-lab
description: Firmware and OS compliance baseline for the isolated real lab.
components:
  - id: hpe_ilo_firmware
    device: iLO
    label: HPE iLO firmware
    minimum: "3.19"
    approved: ["3.19"]
    unknown_policy: blocked
    next_action: "Inventory iLO through Redfish, then stage an approved HPE iLO firmware package if the version is below baseline."
  - id: hpe_bios_version
    device: HPE Server
    label: HPE BIOS version
    minimum: null
    approved: []
    minimum_by_family: ["U30=3.66", "U31=3.66", "U32=3.66", "U33=3.66", "U34=3.66", "U37=3.66", "U38=3.66", "U39=3.66", "U40=3.66", "U41=3.66", "U45=3.66", "U46=2.64", "U47=2.64", "U50=2.64", "U56=2.64", "U60=2.64", "U61=2.64", "U64=2.64", "A40=3.72", "A41=3.72", "A42=4.04", "A43=4.04", "A46=4.04", "A47=4.04", "A48=4.04"]
    approved_by_family: ["U32=U32 v3.66 (04/01/2026)", "U46=U46 v2.64 (04/01/2026)", "U47=U47 v2.64 (04/01/2026)", "A42=A42 v4.04 (04/02/2026)", "A43=A43 v4.04 (04/02/2026)", "A46=A46 v4.04 (04/02/2026)", "A47=A47 v4.04 (04/02/2026)", "A48=A48 v4.04 (04/02/2026)"]
    unknown_policy: warning
    next_action: "Use the SPP BIOS package that matches the detected BIOS family, for example U32_3.66_04_01_2026.fwpkg for DL360 Gen10 U32 systems, U46_2.64_04_01_2026.fwpkg for matching Gen10 Plus U46 systems, or the matching A-family package for Gen11 systems."
  - id: hpe_smart_array_firmware
    device: HPE Smart Array
    label: HPE Smart Array controller firmware
    minimum: "8.00"
    approved: ["8.00"]
    required_intermediate_versions: ["5.61"]
    unknown_policy: warning
    next_action: "For the P408i-a SR Gen10 controller, stage the 5.61 bridge package if the current firmware is below 5.61, then apply the Gen10 SPP HPE_SR_Gen10_8.00_A.fwpkg package after live inventory and vendor prechecks."
  - id: cisco_ios_xe_version
    device: Cisco
    label: Cisco IOS XE version
    minimum: "17.9"
    approved: []
    unknown_policy: blocked
    next_action: "Run Cisco read-only show version collection before bootstrap/apply."
  - id: cisco_bootloader_rommon
    device: Cisco
    label: Cisco bootloader/ROMMON
    minimum: null
    approved: []
    unknown_policy: warning
    next_action: "Collect Cisco boot variable and ROMMON details from read-only show commands."
  - id: netapp_ontap_version
    device: NetApp
    label: ONTAP version
    minimum: "9.14"
    approved: []
    unknown_policy: blocked
    next_action: "Set NETAPP_CURRENT_ONTAP_VERSION from verified ONTAP read-only discovery before setup."
  - id: netapp_disk_firmware
    device: NetApp
    label: NetApp disk firmware
    minimum: null
    approved: []
    unknown_policy: warning
    next_action: "Collect disk firmware inventory through an approved read-only NetApp workflow."
  - id: netapp_shelf_firmware
    device: NetApp
    label: NetApp shelf firmware
    minimum: null
    approved: []
    unknown_policy: warning
    next_action: "Collect shelf firmware inventory through an approved read-only NetApp workflow."
  - id: netapp_sp_bmc_firmware
    device: NetApp
    label: NetApp SP/BMC firmware
    minimum: null
    approved: []
    unknown_policy: warning
    next_action: "Collect SP/BMC firmware inventory through an approved read-only NetApp workflow."
