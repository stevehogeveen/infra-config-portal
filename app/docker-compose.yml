services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-infra_config_portal}
      POSTGRES_USER: ${POSTGRES_USER:-infra_config_portal}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-infra_config_portal_local_only}
    ports:
      - "5433:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-infra_config_portal} -d ${POSTGRES_DB:-infra_config_portal}"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ..
      dockerfile: app/backend/Dockerfile
    environment:
      APP_NAME: infra-config-portal
      ENVIRONMENT: local
      PROVIDER_MODE: mock
      HPE_SANITIZE_DEVICE_IDS: ${HPE_SANITIZE_DEVICE_IDS:-}
      FIRMWARE_MEDIA_ROOT: /workspace/artifacts/Media
      FIRMWARE_MEDIA_HOST_PATH: ${FIRMWARE_MEDIA_HOST_PATH:-}
      ESXI_MEDIA_HTTP_HOST: ${ESXI_MEDIA_HTTP_HOST:-}
      ESXI_MEDIA_HTTP_PORT: 8088
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-infra_config_portal}:${POSTGRES_PASSWORD:-infra_config_portal_local_only}@postgres:5432/${POSTGRES_DB:-infra_config_portal}
      CORS_ORIGINS: http://127.0.0.1:5173,http://localhost:5173
    ports:
      - "${BACKEND_PORT:-8001}:8000"
      - "8088:8088"
    volumes:
      - ../.local:/workspace/.local
      - ../artifacts:/workspace/artifacts
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=2).read()\""]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  frontend:
    image: node:24-alpine
    working_dir: /workspace/app/frontend
    command: sh -c "npm ci && npm run dev"
    environment:
      APP_PROXY_TARGET: http://backend:8000
      FRONTEND_HOST: 0.0.0.0
      FRONTEND_PORT: 5173
      VITE_API_BASE_URL: ""
    ports:
      - "${FRONTEND_PORT:-5173}:5173"
    volumes:
      - ./frontend/src:/workspace/app/frontend/src:ro
      - ./frontend/index.html:/workspace/app/frontend/index.html:ro
      - ./frontend/package.json:/workspace/app/frontend/package.json:ro
      - ./frontend/package-lock.json:/workspace/app/frontend/package-lock.json:ro
      - ./frontend/tsconfig.json:/workspace/app/frontend/tsconfig.json:ro
      - ./frontend/vite.config.ts:/workspace/app/frontend/vite.config.ts:ro
      - frontend-node-modules:/workspace/app/frontend/node_modules
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:5173/overview"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

volumes:
  postgres-data:
  frontend-node-modules:
