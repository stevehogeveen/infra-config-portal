# Project-scoped Codex defaults for infra-config-portal.
#
# Safety model:
# - Codex defaults to reading and editing this Git workspace only.
# - Codex must not request approval prompts during non-interactive runs.
# - danger-full-access is not a default; the wrapper scripts allow it only when
#   explicitly requested with CODEX_DANGER_ACK=I_UNDERSTAND for isolated local
#   development machines where the normal bwrap sandbox cannot start.
# - Codex must not use --yolo or broad filesystem access by default.
# - Generated shell commands should not receive infrastructure provider secrets.
# - Provider development remains mock-first; no real vSphere, ESXi, iLO,
#   NetApp, switch, OVF, storage, AWX, Terraform, or source-of-truth API calls.

sandbox_mode = "workspace-write"
approval_policy = "never"
web_search = "disabled"

[sandbox_workspace_write]
# Keep automated local repo tasks offline by default. Dependency installation
# may require an explicit human-run setup command outside codex exec.
network_access = false

[shell_environment_policy]
# Forward only generic local development variables to commands spawned by Codex.
# Do not forward provider credentials, cloud credentials, tokens, hostnames, or
# site-specific environment variables into tests or build scripts.
include_only = [
  # Windows PowerShell needs the Windows baseline variables below to initialize
  # correctly inside `codex exec` sandboxed runs. Without them, managed
  # PowerShell can fail before commands start with error 8009001d.
  "APPDATA",
  "COMSPEC",
  "HOME",
  "LOCALAPPDATA",
  "PATH",
  "PATHEXT",
  "PROCESSOR_ARCHITECTURE",
  "ProgramData",
  "ProgramFiles",
  "ProgramFiles(x86)",
  "ProgramW6432",
  "PSModulePath",
  "PWD",
  "SHELL",
  "SystemRoot",
  "TERM",
  "TEMP",
  "TMP",
  "TMPDIR",
  "USER",
  "USERPROFILE",
  "WINDIR",
  "LOGNAME",
  "LANG",
  "LC_ALL",
  "LC_CTYPE",
]
